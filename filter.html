<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio Filter</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#e8f0fe;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:white;
            width:500px;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }

        h1{
            color:#1565c0;
            margin-bottom:20px;
        }

        .resultado{
            margin-top:20px;
            padding:15px;
            background:#f5f5f5;
            border-radius:8px;
            text-align:left;
        }

        p{
            margin:8px 0;
            font-size:18px;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>Alunos Aprovados</h1>

    <div class="resultado" id="resultado"></div>

</div>

<script>

const alunos = [
    { nome: "Ana", nota: 95 },
    { nome: "Bruno", nota: 68 },
    { nome: "Carlos", nota: 74 },
    { nome: "Daniela", nota: 88 },
    { nome: "Eduardo", nota: 59 },
    { nome: "Fernanda", nota: 100 },
    { nome: "Gabriel", nota: 70 },
    { nome: "Helena", nota: 63 }
];

const aprovados = alunos.filter(aluno => aluno.nota >= 70);

const resultado = document.getElementById("resultado");

resultado.innerHTML = "<p><strong>Lista de aprovados:</strong></p>";

aprovados.forEach(aluno => {
    resultado.innerHTML += `<p>${aluno.nome} - Nota: ${aluno.nota}</p>`;
});

</script>

</body>
</html>
