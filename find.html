<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio Find</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#e8f0fe;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:white;
            width:500px;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            text-align:center;
        }

        h1{
            color:#1565c0;
            margin-bottom:20px;
        }

        .resultado{
            margin-top:20px;
            padding:15px;
            background:#f5f5f5;
            border-radius:8px;
            text-align:left;
        }

        p{
            margin:8px 0;
            font-size:18px;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>Monitoramento de Temperatura</h1>

    <div class="resultado" id="resultado"></div>

</div>

<script>

const temperaturas = [
    36.4,
    36.8,
    37.2,
    37.4,
    37.7,
    38.1,
    37.9,
    36.9
];

const primeiraFebre = temperaturas.find(temp => temp > 37.5);

const resultado = document.getElementById("resultado");

resultado.innerHTML = `
    <p><strong>Medições do dia:</strong></p>
    <p>${temperaturas.join("°C | ")}°C</p>

    <hr style="margin:15px 0;">

    <p><strong>Primeira temperatura com febre:</strong></p>
    <p>${primeiraFebre}°C 🌡️</p>
`;

</script>

</body>
</html>
